name: Gerar APK Homologacao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    name: APK Android de homologacao
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Habilitar modo homologacao
        run: |
          cat > public/homologacao-config.json <<'EOF'
          {
            "habilitado": true
          }
          EOF

      - name: Validar TypeScript
        run: npm run validate

      - name: Executar testes
        run: npm run test

      - name: Gerar build web
        run: npm run build

      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar visibilidade dos apps externos
        run: node scripts/node/aplicar-queries-android.mjs

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Preparar artefato
        run: |
          mkdir -p APK
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             APK/DeliveryHub-Homologacao-v0.3.3.apk
          sha256sum APK/DeliveryHub-Homologacao-v0.3.3.apk \
             > APK/DeliveryHub-Homologacao-v0.3.3.sha256.txt

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryHub-Homologacao-v0.3.3
          path: APK/
          if-no-files-found: error
          retention-days: 30
